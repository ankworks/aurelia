# Aurelia Browser - fast CI.
#
# Scope: everything that does NOT need a Chromium checkout. Formatting, linting,
# types, unit tests, patch verification, supply-chain policy and secret scanning
# all run here in a few minutes on a GitHub-hosted runner.
#
# Chromium validation is manual-only in chromium-build.yml. Standard hosted
# runners are blocked before source sync unless they meet the recorded resource
# minimums; this fast workflow never fetches or compiles Chromium.
name: CI (fast)

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-fast-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: these jobs only read the repository.
permissions:
  contents: read

jobs:
  checks:
    name: Format, lint, typecheck, test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  windows-bootstrap-regression:
    name: Windows depot_tools GN bootstrap regression
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test Windows bootstrap and batch invocation
        run: npx vitest run tests/tools/depot-tools-bootstrap.test.mjs tests/tools/exec.test.mjs

  repository-checks:
    name: Pin, patch set, policy and policy scans
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Fast repository checks (offline)
        run: node tools/ci/fast-checks.mjs

      - name: Verify the pin (tag and chrome/VERSION)
        env:
          # verify-pin.mjs reads chrome/VERSION through the GitHub API, so this
          # step needs a token; without it every fast-CI run fails here.
          GH_TOKEN: ${{ github.token }}
        run: node tools/chromium/verify-pin.mjs

      - name: Verify the patch set against the pinned Chromium revision
        env:
          # gh supplies the Authorization header from this Actions GITHUB_TOKEN.
          # Read-only token: enough to read public upstream files, and nothing
          # in this workflow can push, tag or publish.
          GH_TOKEN: ${{ github.token }}
        run: node tools/chromium/cli.mjs verify-patches --online

      - name: Report available Chromium updates (informational)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/chromium/cli.mjs check-updates
