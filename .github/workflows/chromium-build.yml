name: Chromium build validation

# Manual only. Every run is measured first and is not allowed to start a Chromium
# sync unless it meets the minimum for its validation level:
#   gn                -> reduced GN-only profile (4 cores, 15.5 GB RAM, 80 GB disk,
#                        gclient --no-history shallow checkout).
#                        Runs GN generation and gn check; never compiles.
#   targeted / full   -> strict reference builder (8 cores, 32 GB RAM, 150 GB disk).
#                        A standard runner is BLOCKED before sync for these levels.
# Use the larger option only when the organization has a GitHub-hosted Windows
# larger runner named windows-latest-8-cores (8 CPU, 32 GB RAM, 300 GB SSD).
run-name: Chromium ${{ inputs.validation_level || 'gn' }} validation (${{ inputs.runner_size || 'standard' }} hosted runner)

on:
  workflow_dispatch:
    inputs:
      validation_level:
        description: Validation depth. gn runs GN-only validation (no compilation) and is the only level that can run on the standard runner. targeted and full run only after the prior stages pass in this run and require the strict 8-core / 32 GB builder.
        required: true
        type: choice
        options:
          - gn
          - targeted
          - full
        default: gn
      runner_size:
        description: Standard runner runs gn validation within its reduced profile and reports BLOCKED for targeted and full. larger requires the named GitHub-hosted runner to be configured.
        required: true
        type: choice
        options:
          - standard
          - larger
        default: standard
      chromium_dest:
        description: Optional absolute path for the Chromium checkout. Leave empty to use RUNNER_TEMP\aurelia-chromium. Set it to a directory on a volume that runner-preflight reports as meeting the 150 GB free-disk floor (the C and D drives are separate volumes on GitHub-hosted Windows runners, so cleanup on C cannot free space on D).
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: chromium-build-validation-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate:
    name: ${{ inputs.validation_level || 'gn' }} / ${{ inputs.runner_size || 'standard' }}
    runs-on: ${{ inputs.runner_size == 'larger' && 'windows-latest-8-cores' || 'windows-2025' }}
    timeout-minutes: 360
    env:
      AURELIA_VALIDATION_LEVEL: ${{ inputs.validation_level || 'gn' }}
      AURELIA_RUNNER_SIZE: ${{ inputs.runner_size || 'standard' }}
      AURELIA_CHROMIUM_DEST: ${{ inputs.chromium_dest }}
      DEPOT_TOOLS_UPDATE: '0'
      DEPOT_TOOLS_WIN_TOOLCHAIN: '0'
      GCLIENT_PY3: '1'
      NINJA_SUMMARIZE_BUILD: '1'
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: Check out Aurelia without persisting credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Run pinned Chromium validation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          if ([string]::IsNullOrWhiteSpace($env:AURELIA_CHROMIUM_DEST)) {
            $destination = Join-Path $env:RUNNER_TEMP 'aurelia-chromium'
          } else {
            $destination = $env:AURELIA_CHROMIUM_DEST
          }
          Write-Host "chromium destination: $destination"
          $artifactDirectory = Join-Path $env:GITHUB_WORKSPACE 'artifacts'
          & node tools/chromium/ci-validation.mjs `
            --mode $env:AURELIA_VALIDATION_LEVEL `
            --runner-size $env:AURELIA_RUNNER_SIZE `
            --dest $destination `
            --artifacts $artifactDirectory
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            Write-Host "::error::Chromium validation exited with code $exitCode. See the build summary and stage logs."
            exit $exitCode
          }

      - name: Publish build summary
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $summaryPath = Join-Path $env:GITHUB_WORKSPACE 'artifacts\build-summary.md'
          if (Test-Path $summaryPath) {
            Get-Content $summaryPath -Raw | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } else {
            @(
              '# Chromium build validation summary',
              '',
              '- Overall status: **NOT TESTED**',
              '- The validation process did not create a summary. Inspect the workflow logs.'
            ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - name: Upload validation logs and eligible browser artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chromium-build-validation-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
